name: Continuous builds

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - NAME: Packages x86_64
            RUNS_ON: ubuntu-24.04
            DOCKER_PLATFORM: linux/amd64
          - NAME: Packages aarch64
            RUNS_ON: ubuntu-24.04-arm
            DOCKER_PLATFORM: linux/arm64/v8
          - NAME: Packages armhf
            RUNS_ON: ubuntu-24.04-arm
            DOCKER_PLATFORM: linux/arm/v7
          - NAME: Lite AppImage x86_64
            RUNS_ON: ubuntu-24.04
            DOCKER_PLATFORM: linux/amd64
            BUILD_LITE: 1
          - NAME: Lite AppImage aarch64
            RUNS_ON: ubuntu-24.04-arm
            DOCKER_PLATFORM: linux/arm64/v8
            BUILD_LITE: 1
          - NAME: Lite AppImage armhf
            RUNS_ON: ubuntu-24.04-arm
            DOCKER_PLATFORM: linux/arm/v7
            BUILD_LITE: 1

    name: ${{ matrix.NAME }}
    env:
      DOCKER_PLATFORM: ${{ matrix.DOCKER_PLATFORM }}
      DIST: ${{ matrix.DIST }}
      BUILD_LITE: ${{ matrix.BUILD_LITE }}
    runs-on: ${{ matrix.RUNS_ON }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build in Docker
        run: bash -ex ci/build-in-docker.sh
      - name: Archive artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build ${{ matrix.NAME }}
          path: |
              appimagelauncher*.deb*
              appimagelauncher*.rpm*
              appimagelauncher*.tar*
              appimagelauncher-lite-*.AppImage*

  release:
    name: Create release and upload artifacts
    needs:
      - build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Inspect directory after downloading artifacts
        run: ls -alFR artifacts
      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              tag="${GITHUB_REF_NAME}"
              flags=()
          else
              tag=continuous
              flags=(--prerelease)
              gh release delete "$tag" --cleanup-tag --yes || true
          fi
          gh release create "$tag" "${flags[@]}" --target "$GITHUB_SHA" --title "$tag" \
              --notes "Automated build of $GITHUB_SHA" \
              artifacts/appimagelauncher*.deb* artifacts/appimagelauncher*.rpm* \
              artifacts/appimagelauncher*.tar* artifacts/appimagelauncher-lite-*.AppImage*
